[package]
name = "wayland-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
license = "Apache-2.0"
description = "Wayland proxy, capture, and compositor-side input MCP server"
readme = "README.md"
publish = false
exclude = ["/.private/**"]

[dependencies]
async-trait = "0.1.92"
base64 = "0.23.1"
busd = { version = "0.8.0", default-features = false }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }
png = "0.18"
libc = "0.2"
ordered-stream = "0.2"
rmcp = { version = "1.8.0", default-features = false, features = ["base64", "server", "transport-async-rw"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shaderc-sys = { version = "0.10.1", features = ["build-from-source"] }
tempfile = "3"
tokio = { version = "1.54.1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zbus = { version = "6.5.0", default-features = false, features = ["tokio"] }
zruntime = "0.2"

[build-dependencies]
shaderc = { version = "0.10.1", features = ["build-from-source"] }

[dev-dependencies]
pretty_assertions = "1"
serial_test = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
